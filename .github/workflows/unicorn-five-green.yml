name: Unicorn five green proof

on:
  pull_request:
    branches:
      - ci/unicorn-five-green-base-20260925
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  focused:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - prefer_flat_math_min_max
          - max_nested_calls
          - consistent_template_literal_escape
          - no_global_object_property_assignment
          - prefer_array_last_methods
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true

      - name: Check format
        shell: bash
        run: |
          set -euo pipefail
          path="internal/plugins/unicorn/rules/${{ matrix.package }}"
          unformatted="$(gofmt -l "$path")"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            gofmt -d "$path"
            exit 1
          fi

      - name: Test and require 100 percent statement coverage
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          cover="${RUNNER_TEMP}/${package}.cover"
          go test "./internal/plugins/unicorn/rules/${package}" -coverprofile="$cover"
          total="$(go tool cover -func="$cover" | awk '/^total:/ {print $3}')"
          echo "coverage=${total}"
          if [[ "$total" != "100.0%" ]]; then
            echo "::error::${package} statement coverage is ${total}, expected 100.0%"
            go tool cover -func="$cover"
            exit 1
          fi
          echo "GREEN_CHECKPOINT_OK ${package}"
